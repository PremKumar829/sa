<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Task Verification</title>
    <!-- Confetti Library for Success Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .safe-container {
            max-width: 420px;
            width: 90%;
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .badge {
            background: #eff6ff;
            color: #2563eb;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .lang-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .scarcity-box {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            font-size: 11px;
            font-weight: 600;
            padding: 7px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .safe-container h1 {
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .safe-container p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background: #fff;
        }
        .form-control:focus {
            border-color: #2563eb;
        }
        .safe-btn {
            display: block;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            text-align: center;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
            animation: glowing-btn 2s infinite;
        }
        .safe-btn:disabled {
            background: #94a3b8;
            animation: none;
            cursor: not-allowed;
            box-shadow: none;
        }
        @keyframes glowing-btn {
            0% { box-shadow: 0 0 5px rgba(37, 99, 235, 0.4); }
            50% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.8); }
            100% { box-shadow: 0 0 5px rgba(37, 99, 235, 0.4); }
        }
        #loader-screen {
            display: none;
            padding: 30px 10px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loader-text {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }
        .safe-footer {
            margin-top: 18px;
            font-size: 10px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }
    </style>
</head>
<body>

  <div class="safe-container">
    
    <!-- Step 1: Form View -->
    <div id="form-screen">
      <div class="top-bar">
        <div class="badge" id="lang-badge">Google Maps Task Verification</div>
        <button type="button" class="lang-btn" onclick="toggleLanguage()" id="lang-toggle-btn">हिंदी / Eng</button>
      </div>
      
      <!-- Live Success / Urgency Counter -->
      <div class="scarcity-box" id="scarcity-text">⚡ <span id="counter-num">1,482</span> Participants verified today!</div>

      <h1 id="main-title">Participant Details</h1>
      <p id="main-desc">Enter your details below to verify task eligibility.</p>
      
      <form id="userTaskForm" onsubmit="processUser(event)">
        <div class="form-group">
          <label for="u-name" id="lbl-name">Your Full Name</label>
          <input type="text" id="u-name" class="form-control" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="u-gender" id="lbl-gender">Select Gender</label>
          <select id="u-gender" class="form-control" required>
            <option value="" disabled selected id="opt-default">Choose gender</option>
            <option value="Male" id="opt-male">Male</option>
            <option value="Female" id="opt-female">Female</option>
            <option value="Other" id="opt-other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="u-age" id="lbl-age">Your Age</label>
          <input type="number" id="u-age" class="form-control" placeholder="Enter age (18-80)" min="18" max="80" required />
        </div>

        <button type="submit" id="submit-btn" class="safe-btn">Send Message to Receptionist</button>
      </form>
    </div>

    <!-- Step 2: Loader View with Confetti -->
    <div id="loader-screen">
      <div class="spinner"></div>
      <div id="loader-text">Verifying participant details...</div>
      <p style="margin-top: 8px; font-size: 11px; color: #64748b;" id="loader-sub">Please do not close this window.</p>
    </div>

    <div class="safe-footer" id="footer-text">
        Secure Verification Gateway &bull; 100% Safe
    </div>
  </div>

  <script>
    // Language Toggle State (default English)
    var currentLang = 'en';

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'hi' : 'en';
      if(currentLang === 'hi') {
        document.getElementById('main-title').innerText = "प्रतिभागी विवरण";
        document.getElementById('main-desc').innerText = "टास्क पात्रता सत्यापित करने के लिए नीचे अपनी जानकारी दर्ज करें।";
        document.getElementById('lbl-name').innerText = "आपका पूरा नाम";
        document.getElementById('u-name').placeholder = "अपना पूरा नाम दर्ज करें";
        document.getElementById('lbl-gender').innerText = "लिंग चुनें";
        document.getElementById('opt-default').innerText = "लिंग चुनें";
        document.getElementById('opt-male').innerText = "पुरुष";
        document.getElementById('opt-female').innerText = "महिला";
        document.getElementById('opt-other').innerText = "अन्य";
        document.getElementById('lbl-age').innerText = "आपकी उम्र";
        document.getElementById('u-age').placeholder = "उम्र दर्ज करें (18-80)";
        document.getElementById('submit-btn').innerText = "रिसेप्शनिस्ट को संदेश भेजें";
        document.getElementById('scarcity-text').innerHTML = "⚡ आज <span id='counter-num'>1,482</span> लोग सत्यापित हो चुके हैं!";
      } else {
        document.getElementById('main-title').innerText = "Participant Details";
        document.getElementById('main-desc').innerText = "Enter your details below to verify task eligibility.";
        document.getElementById('lbl-name').innerText = "Your Full Name";
        document.getElementById('u-name').placeholder = "Enter your full name";
        document.getElementById('lbl-gender').innerText = "Select Gender";
        document.getElementById('opt-default').innerText = "Choose gender";
        document.getElementById('opt-male').innerText = "Male";
        document.getElementById('opt-female').innerText = "Female";
        document.getElementById('opt-other').innerText = "Other";
        document.getElementById('lbl-age').innerText = "Your Age";
        document.getElementById('u-age').placeholder = "Enter age (18-80)";
        document.getElementById('submit-btn').innerText = "Send Message to Receptionist";
        document.getElementById('scarcity-text').innerHTML = "⚡ Only <span id='counter-num'>3</span> Receptionist Slots Available Today!";
      }
    }

    // Page load count tracking & dynamic counter increase
    var visits = parseInt(localStorage.getItem('total_visits') || '0') + 1;
    localStorage.setItem('total_visits', visits);

    function processUser(e) {
      e.preventDefault();
      
      var name = document.getElementById('u-name').value.trim();
      var age = document.getElementById('u-age').value;

      if(name.length < 3 || /^\d+$/.test(name)) {
        alert(currentLang === 'hi' ? "कृपया एक वैध नाम दर्ज करें।" : "Please enter a valid real name.");
        return;
      }
      if(age < 18 || age > 80) {
        alert(currentLang === 'hi' ? "उम्र 18 से 80 के बीच होनी चाहिए।" : "Age must be between 18 and 80.");
        return;
      }

      // Trigger Confetti Animation 🎉
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      var btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = currentLang === 'hi' ? "प्रक्रिया जारी है..." : "Processing...";

      document.getElementById('form-screen').style.display = 'none';
      document.getElementById('loader-screen').style.display = 'block';

      setTimeout(function() {
        document.getElementById('loader-text').innerText = currentLang === 'hi' ? "उपलब्ध स्लॉट की जांच की जा रही है..." : "Checking available receptionist slots...";
      }, 1200);

      setTimeout(function() {
        document.getElementById('loader-text').innerText = currentLang === 'hi' ? "एजेंट से कनेक्ट किया जा रहा है..." : "Assigning our Agent to Process...";
      }, 2500);

      var clicks = JSON.parse(localStorage.getItem('click_logs') || '[]');
      var now = new Date();
      var timeString = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
      clicks.push(timeString);
      localStorage.setItem('click_logs', JSON.stringify(clicks));

      var tgId = "mRByr5WGPzxjY2U9"; 
      var finalLink = "https://t.me/+" + tgId;

      setTimeout(function() {
          window.location.href = finalLink;
      }, 4000);
    }
  </script>
</body>
</html>
